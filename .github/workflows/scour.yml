name: Scour

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  scour:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so scour can diff the PR against its base ref.
          fetch-depth: 0

      - name: Run scour
        # Pinned to a real release tag (no v1 tag exists upstream yet).
        uses: carsonSgit/scour@v0.4.0
        with:
          fail-on: warning
          triage: "true"
